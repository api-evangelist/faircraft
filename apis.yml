description: Faircraft is a biotechnology company creating a new class of cultivated materials, starting
  with real leather grown in the lab from animal cells rather than raised on farms. Using cell biology
  and protein engineering, it produces genuine leather (product lines FCL_001 through FCL_006) with the
  look, feel, and performance of traditional hides but with a lower environmental footprint and no animal
  farming, and customizable properties for fashion, automotive, and luxury brands. Backed by Kindred
  Ventures, Faircraft is a materials-science company with no public developer or API surface at this time.
